<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習題</title>
    <link rel="icon" href="icon.png">
    <style>
        html {
            --color0: #e0e0e0;
            --color1: #ffffff;
            --color2: #000000;
            --color3: #7fcfff;
            --color4: #7fff7f;
            --color5: #ff7f7f;
            font-size: 32px;
        }
        
        html.dark {
            --color0: #202020;
            --color1: #101010;
            --color2: #e0e0e0;
            --color3: #005080;
            --color4: #007f00;
            --color5: #7f0000;
        }
        
        * {
            background-color: var(--color1);
            color: var(--color2);
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }
        
        .divShow {
            position: relative;
            left: 0;
            top: 0;
            display: block;
            text-align: center;
        }
        
        .divHide {
            display: none;
        }
        
        #form {
            display: block;
            margin: 10px;
            #fileName {
                width: 80%;
                padding: 0 10px;
            }
        }
        
        button {
            background: var(--color0);
            border: 1px var(--color2) solid;
            border-radius: 10px;
            padding: 5px 20px;
            margin: 10px;
        }
        
        button:hover {
            filter: brightness(0.8);
        }
        
        button:active {
            scale: 0.95;
        }
        
        #mainTitle,
        #mainIndex {
            display: block;
            margin: 10px;
        }
        
        #mainIndex {
            border: 5px double var(--color2);
            padding: 0 10%;
            text-align: left;
        }
        
        .select {
            border: 5px double var(--color2);
            background: var(--color3);
            scale: 0.95;
        }
        
        .cerrect {
            background: var(--color4);
            scale: 1;
        }
        
        .false {
            background: var(--color5);
            scale: 1;
        }
        
        img.icon {
            background: #00000000;
            margin: 0 10px;
            width: 32px;
            height: 32px;
        }
    </style>
</head>

<body>
    <div id="init" class="divShow">
        <span id="initTitle">選擇題目</span>
        <form id="form">
            <select name="fileName" id="fileName" autocomplete="on">
                <option value="init" selected>-- 請選擇 --</option>
            </select>
        </form>
        <button onclick="gets();">確認</button>
        <br>
        <button onclick="mode('dark');" id="mode">深色模式</button>
        <br>
        <span>字型大小</span>
        <br>
        <button onclick="document.documentElement.style.fontSize = '16px';">小</button>
        <button onclick="document.documentElement.style.fontSize = '24px';">中</button>
        <button onclick="document.documentElement.style.fontSize = '32px';">大</button>
    </div>
    <div id="main" class="divHide">
        <span id="mainTitle"></span>
        <div id="mainIndex"></div>
    </div>
</body>
<script src="qua.js "></script>
<script src="script.js "></script>

</html>
